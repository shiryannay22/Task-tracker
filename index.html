<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>לוח משימות</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;500;600;700;800&display=swap');

  :root {
    --paper: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #1D3557;
    --muted: #4A5D79;
    --line: #E2E8EA;
    --accent: #1D3557;
    --accent-soft: #DDE4EA;
    --accent2: #457B9D;
    --accent2-soft: #E3EBF0;
    --teal: #2E8388;
    --teal-soft: #F1FAEE;
    --urgency-low: var(--teal);
    --urgency-low-soft: var(--teal-soft);
    --urgency-medium: #457B9D;
    --urgency-medium-soft: #E3EBF0;
    --urgency-high: #E63946;
    --urgency-high-soft: #FBE3E6;
    --status-todo: #4A5D79;
    --status-todo-soft: #E4E7EB;
    --status-in_progress: #457B9D;
    --status-in_progress-soft: #E3EBF0;
    --status-done: var(--teal);
    --status-done-soft: var(--teal-soft);
    --shadow: 0 4px 18px rgba(29, 53, 87, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Assistant', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 20px 60px;
  }

  svg.lucide { stroke-width: 2px; }

  .tt-header {
    max-width: 780px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tt-title-wrap { display: flex; align-items: center; gap: 12px; }
  .tt-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 27px;
    margin: 0;
    color: var(--ink);
  }
  .tt-icon-badge {
    width: 44px; height: 44px;
    border-radius: 13px;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(29, 53, 87, 0.24);
  }

  .tt-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px;
    gap: 4px;
    box-shadow: var(--shadow);
  }
  .tt-toggle button {
    border: none;
    background: transparent;
    padding: 9px 20px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: background .15s, color .15s;
  }
  .tt-toggle button.active { background: var(--accent); color: white; }

  .tt-container { max-width: 780px; margin: 0 auto; }

  .tt-form {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 26px;
    box-shadow: var(--shadow);
  }
  .tt-form-title {
    font-weight: 800;
    font-size: 15.5px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink);
  }
  .tt-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tt-input-wrap {
    flex: 1 1 220px;
    position: relative;
    display: flex;
    align-items: center;
  }
  .tt-input-wrap svg { position: absolute; right: 14px; color: var(--muted); pointer-events: none; }
  .tt-input {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 42px 12px 14px;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--paper);
    transition: border-color .15s;
  }
  .tt-input:focus { outline: none; border-color: var(--accent2); background: var(--surface); }

  .tt-textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    margin-top: 10px;
    resize: vertical;
    min-height: 44px;
    transition: border-color .15s;
  }
  .tt-textarea:focus { outline: none; border-color: var(--accent2); background: var(--surface); }

  .tt-form-files-section { margin-top: 10px; }
  .tt-form-files-section .tt-file-row { margin-bottom: 6px; }

  .tt-pill-group { display: flex; gap: 6px; }
  .tt-pill {
    border: 1.5px solid var(--line);
    background: var(--paper);
    border-radius: 999px;
    padding: 10px 15px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .tt-pill.selected { color: white; border-color: transparent; }

  .tt-recurring {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    background: var(--paper);
    transition: all .15s;
  }
  .tt-recurring.selected {
    color: var(--accent2);
    border-color: var(--accent2);
    background: var(--accent2-soft);
  }
  .tt-recurring input { display: none; }

  .tt-recur-date-wrap {
    display: none;
    flex-direction: column;
    gap: 10px;
    border: 1.5px solid var(--accent2);
    background: var(--accent2-soft);
    border-radius: 14px;
    padding: 12px 14px;
    width: 100%;
  }
  .tt-recur-date-wrap.visible { display: flex; }

  .tt-recur-type-group { display: flex; gap: 6px; }
  .tt-recur-type-btn {
    border: 1.5px solid var(--accent2);
    background: var(--surface);
    color: var(--accent2);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .tt-recur-type-btn.selected { background: var(--accent2); color: white; }

  .tt-weekday-group { display: flex; gap: 5px; flex-wrap: wrap; }
  .tt-weekday-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tt-weekday-btn.selected { background: var(--accent2); color: white; border-color: transparent; }

  .tt-monthday-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .tt-monthday-input {
    width: 64px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 7px 8px;
    font-family: inherit;
    font-size: 13px;
    text-align: center;
    background: var(--surface);
    color: var(--ink);
  }
  .tt-monthday-input:focus { outline: none; border-color: var(--accent2); }

  .tt-recur-time-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent2);
    font-size: 13px;
    font-weight: 600;
  }
  .tt-time-input {
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--ink);
  }
  .tt-time-input:focus { outline: none; border-color: var(--accent2); }

  .tt-submit-row { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .tt-btn-primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 6px 16px rgba(29, 53, 87, 0.24);
    transition: transform .1s;
  }
  .tt-btn-primary:hover { transform: translateY(-1px); }
  .tt-btn-primary:disabled { opacity: .6; cursor: default; transform: none; }
  .tt-btn-ghost {
    background: transparent;
    border: 1.5px solid var(--line);
    color: var(--muted);
    border-radius: 12px;
    padding: 12px 18px;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tt-error {
    color: var(--urgency-high);
    font-size: 13px;
    margin: 12px 0 0;
    font-weight: 700;
    display: none;
    align-items: center;
    gap: 6px;
  }

  .tt-section-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 800;
    margin: 0 0 12px 2px;
    letter-spacing: .2px;
  }

  .tt-empty {
    background: var(--surface);
    border: 1.5px dashed var(--line);
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .tt-empty svg { margin-bottom: 8px; color: var(--muted); }

  .tt-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-right: 4px solid var(--urgency-color);
  }
  .tt-card.done {
    background: var(--status-done-soft);
    border-color: #D3ECC9;
  }
  .tt-card.done .tt-card-title {
    text-decoration: line-through;
    color: var(--muted);
  }
  .tt-card.pulse { animation: tt-pop .4s ease; }
  @keyframes tt-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.02); box-shadow: 0 10px 24px rgba(46,131,136,0.25); }
    100% { transform: scale(1); }
  }

  .tt-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .tt-card-title { font-weight: 700; font-size: 15.5px; margin: 0; color: var(--ink); display: flex; align-items: center; gap: 7px; }
  .tt-done-badge {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--status-done);
    color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .tt-card-desc {
    font-size: 13.5px;
    color: var(--muted);
    margin: 6px 0 0;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .tt-note-box {
    margin-top: 12px;
    background: var(--accent2-soft);
    border: 1px solid #CFE0E9;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .tt-note-box-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--accent2);
    margin: 0 0 4px;
  }
  .tt-note-box-text {
    font-size: 13.5px;
    color: var(--ink);
    margin: 0;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .tt-note-edit-wrap { margin-top: 12px; }
  .tt-note-edit-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--accent2);
    margin: 0 0 5px;
  }
  .tt-note-textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--accent2-soft);
    resize: vertical;
    min-height: 40px;
    transition: border-color .15s;
  }
  .tt-note-textarea:focus { outline: none; border-color: var(--accent2); background: var(--surface); }
  .tt-note-saved {
    font-size: 11px;
    color: var(--muted);
    margin: 4px 2px 0;
    display: none;
  }
  .tt-note-saved.visible { display: block; }

  .tt-files {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .tt-files-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .tt-file-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 10px;
    margin-bottom: 6px;
  }
  .tt-file-row svg { color: var(--accent2); flex-shrink: 0; }
  .tt-file-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tt-file-progress {
    font-size: 12px;
    color: var(--accent2);
    font-weight: 700;
  }
  .tt-upload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px dashed var(--accent2);
    color: var(--accent2);
    background: var(--accent2-soft);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .tt-upload-btn:hover { background: #D3E3EA; }
  .tt-card-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .tt-icon-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .tt-icon-btn:hover { background: var(--accent2-soft); color: var(--accent2); }
  .tt-icon-btn.danger:hover { background: var(--urgency-high-soft); color: var(--urgency-high); }

  .tt-meta { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .tt-chip {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 11px 5px 9px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tt-recur-chip {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent2);
    background: var(--accent2-soft);
    padding: 5px 11px 5px 9px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tt-status-group { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .tt-status-pill {
    border: 1.5px solid var(--line);
    background: var(--paper);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  .tt-status-pill.selected { border-color: transparent; }
  .tt-status-readonly {
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 12px 5px 10px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  @media (max-width: 480px) {
    .tt-title { font-size: 22px; }
    .tt-row { flex-direction: column; align-items: stretch; }
    .tt-pill-group { justify-content: space-between; }
  }
</style>
</head>
<body>

  <div class="tt-header">
    <div class="tt-title-wrap">
      <div class="tt-icon-badge"><i data-lucide="clipboard-list" size="22"></i></div>
      <p class="tt-title">לוח משימות</p>
    </div>
    <div class="tt-toggle">
      <button id="btn-manager" class="active"><i data-lucide="user-cog" size="15"></i>יעל</button>
      <button id="btn-employee"><i data-lucide="user" size="15"></i>שיר</button>
    </div>
  </div>

  <div class="tt-container">
    <form class="tt-form" id="tt-form">
      <p class="tt-form-title" id="form-title"><i data-lucide="sparkles" size="16"></i>משימה חדשה</p>
      <div class="tt-row">
        <div class="tt-input-wrap">
          <input class="tt-input" id="title-input" placeholder="שם המשימה..." />
          <i data-lucide="pencil-line" size="16"></i>
        </div>
        <div class="tt-pill-group" id="urgency-group">
          <button type="button" class="tt-pill" data-urgency="low"><i data-lucide="arrow-down" size="14"></i>נמוכה</button>
          <button type="button" class="tt-pill selected" data-urgency="medium" style="background: var(--urgency-medium)"><i data-lucide="minus" size="14"></i>בינונית</button>
          <button type="button" class="tt-pill" data-urgency="high"><i data-lucide="flame" size="14"></i>גבוהה</button>
        </div>
        <label class="tt-recurring" id="recurring-label">
          <input type="checkbox" id="recurring-check" />
          <i data-lucide="repeat" size="14"></i>חוזרת
        </label>
        <div class="tt-recur-date-wrap" id="recur-date-wrap">
          <div class="tt-recur-type-group" id="recur-type-group">
            <button type="button" class="tt-recur-type-btn selected" data-type="weekly">שבועי</button>
            <button type="button" class="tt-recur-type-btn" data-type="monthly">חודשי</button>
          </div>
          <div class="tt-weekday-group" id="recur-weekday-group">
            <button type="button" class="tt-weekday-btn" data-day="0">א׳</button>
            <button type="button" class="tt-weekday-btn" data-day="1">ב׳</button>
            <button type="button" class="tt-weekday-btn" data-day="2">ג׳</button>
            <button type="button" class="tt-weekday-btn" data-day="3">ד׳</button>
            <button type="button" class="tt-weekday-btn" data-day="4">ה׳</button>
            <button type="button" class="tt-weekday-btn" data-day="5">ו׳</button>
            <button type="button" class="tt-weekday-btn" data-day="6">ש׳</button>
          </div>
          <div class="tt-monthday-wrap" id="recur-monthday-wrap" style="display:none">
            <i data-lucide="calendar-days" size="14"></i>
            <span>כל</span>
            <input type="number" id="recur-monthday-input" class="tt-monthday-input" min="1" max="31" placeholder="1-31" />
            <span>לחודש</span>
          </div>
          <div class="tt-recur-time-wrap">
            <i data-lucide="clock" size="14"></i>
            <input type="time" id="recur-time-input" class="tt-time-input" />
          </div>
        </div>
      </div>
      <textarea id="desc-input" class="tt-textarea" placeholder="פרטים נוספים (רשות)..." rows="2"></textarea>
      <div class="tt-form-files-section">
        <div id="form-files-list"></div>
        <label class="tt-upload-btn">
          <i data-lucide="upload" size="13"></i><span>הוסיפי קובץ</span>
          <input type="file" id="form-file-input" multiple style="display:none">
        </label>
      </div>
      <div class="tt-submit-row">
        <button type="submit" class="tt-btn-primary" id="submit-btn"><i data-lucide="plus" size="16"></i><span id="submit-btn-text">הוסיפי משימה</span></button>
        <button type="button" class="tt-btn-ghost" id="cancel-btn" style="display:none"><i data-lucide="x" size="14"></i>ביטול</button>
      </div>
      <p class="tt-error" id="form-error"><i data-lucide="alert-circle" size="14"></i><span>צריך לתת שם למשימה לפני השמירה.</span></p>
    </form>

    <p class="tt-section-label" id="section-label">כל המשימות (0)</p>
    <div id="task-list"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, push, onValue, update, remove
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAgyjruelxRDy7DDLh3rjb_RFV0eqQHiJY",
    authDomain: "tasks-5745a.firebaseapp.com",
    databaseURL: "https://tasks-5745a-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tasks-5745a",
    storageBucket: "tasks-5745a.firebasestorage.app",
    messagingSenderId: "235402824952",
    appId: "1:235402824952:web:20e4ea0e349793faf87f0d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const tasksRef = ref(db, "tasks");

  const URGENCY = {
    low: { label: "נמוכה", color: "var(--urgency-low)", soft: "var(--urgency-low-soft)", icon: "arrow-down", pillBg: "#F1FAEE", pillText: "var(--ink)" },
    medium: { label: "בינונית", color: "var(--urgency-medium)", soft: "var(--urgency-medium-soft)", icon: "minus", pillBg: "var(--urgency-medium)", pillText: "white" },
    high: { label: "גבוהה", color: "var(--urgency-high)", soft: "var(--urgency-high-soft)", icon: "flame", pillBg: "var(--urgency-high)", pillText: "white" },
  };
  const STATUS = {
    todo: { label: "לא התחיל", color: "var(--status-todo)", soft: "var(--status-todo-soft)", icon: "circle" },
    in_progress: { label: "בתהליך", color: "var(--status-in_progress)", soft: "var(--status-in_progress-soft)", icon: "loader" },
    done: { label: "הושלם", color: "var(--status-done)", soft: "var(--status-done-soft)", icon: "check-circle-2" },
  };

  let role = "manager";
  let editingId = null;
  let selectedUrgency = "medium";
  let tasksObj = {};
  let justCompletedId = null;
  let selectedRecurType = "weekly";
  let selectedRecurDay = 0;

  const WEEKDAY_NAMES = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];
  const WEEKDAY_SHORT = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];

  const form = document.getElementById("tt-form");
  const titleInput = document.getElementById("title-input");
  const urgencyGroup = document.getElementById("urgency-group");
  const recurringCheck = document.getElementById("recurring-check");
  const recurringLabel = document.getElementById("recurring-label");
  const recurDateWrap = document.getElementById("recur-date-wrap");
  const recurTypeGroup = document.getElementById("recur-type-group");
  const recurWeekdayGroup = document.getElementById("recur-weekday-group");
  const recurMonthdayWrap = document.getElementById("recur-monthday-wrap");
  const recurMonthdayInput = document.getElementById("recur-monthday-input");
  const recurTimeInput = document.getElementById("recur-time-input");
  const descInput = document.getElementById("desc-input");
  const formFilesList = document.getElementById("form-files-list");
  const formFileInput = document.getElementById("form-file-input");
  const submitBtn = document.getElementById("submit-btn");
  const submitBtnText = document.getElementById("submit-btn-text");
  const cancelBtn = document.getElementById("cancel-btn");
  const formTitle = document.getElementById("form-title");
  const formError = document.getElementById("form-error");
  const taskList = document.getElementById("task-list");
  const sectionLabel = document.getElementById("section-label");
  const btnManager = document.getElementById("btn-manager");
  const btnEmployee = document.getElementById("btn-employee");

  function icons() { if (window.lucide) window.lucide.createIcons(); }
  icons();

  function formatDate(isoDate) {
    const [y, m, d] = isoDate.split("-");
    return `${d}/${m}`;
  }

  function formatRecurrence(task) {
    if (task.recurrenceType === "weekly" && task.recurrenceDay != null) {
      let s = `כל יום ${WEEKDAY_NAMES[task.recurrenceDay]}`;
      if (task.recurrenceTime) s += ` · ${task.recurrenceTime}`;
      return s;
    }
    if (task.recurrenceType === "monthly" && task.recurrenceDay) {
      let s = `כל ${task.recurrenceDay} לחודש`;
      if (task.recurrenceTime) s += ` · ${task.recurrenceTime}`;
      return s;
    }
    return "";
  }

  function lastScheduledOccurrence(task, now) {
    const [th, tm] = (task.recurrenceTime || "00:00").split(":").map(Number);
    if (task.recurrenceType === "weekly" && task.recurrenceDay != null) {
      const diffDays = (now.getDay() - task.recurrenceDay + 7) % 7;
      const candidate = new Date(now);
      candidate.setDate(now.getDate() - diffDays);
      candidate.setHours(th, tm, 0, 0);
      if (candidate.getTime() > now.getTime()) candidate.setDate(candidate.getDate() - 7);
      return candidate;
    }
    if (task.recurrenceType === "monthly" && task.recurrenceDay) {
      const candidate = new Date(now.getFullYear(), now.getMonth(), 1, th, tm, 0, 0);
      const lastDayThisMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      candidate.setDate(Math.min(task.recurrenceDay, lastDayThisMonth));
      if (candidate.getTime() > now.getTime()) {
        const prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1, th, tm, 0, 0);
        const lastDayPrevMonth = new Date(prevMonth.getFullYear(), prevMonth.getMonth() + 1, 0).getDate();
        prevMonth.setDate(Math.min(task.recurrenceDay, lastDayPrevMonth));
        return prevMonth;
      }
      return candidate;
    }
    return null;
  }

  function checkAndResetRecurringTasks(obj) {
    const now = new Date();
    Object.entries(obj).forEach(([id, task]) => {
      if (!task.recurring || task.status !== "done") return;
      const occurrence = lastScheduledOccurrence(task, now);
      if (!occurrence) return;
      const changedAt = task.statusChangedAt || 0;
      if (changedAt < occurrence.getTime() && occurrence.getTime() <= now.getTime()) {
        update(ref(db, "tasks/" + id), { status: "todo", statusChangedAt: Date.now() });
      }
    });
  }

  onValue(tasksRef, (snapshot) => {
    tasksObj = snapshot.val() || {};
    checkAndResetRecurringTasks(tasksObj);
    render();
  }, (err) => {
    console.error("Firebase read error:", err);
  });

  urgencyGroup.querySelectorAll(".tt-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedUrgency = btn.dataset.urgency;
      urgencyGroup.querySelectorAll(".tt-pill").forEach(b => {
        b.classList.remove("selected");
        b.style.background = "";
        b.style.color = "";
        b.style.borderColor = "";
      });
      btn.classList.add("selected");
      btn.style.background = URGENCY[selectedUrgency].pillBg;
      btn.style.color = URGENCY[selectedUrgency].pillText;
      btn.style.borderColor = selectedUrgency === "low" ? "var(--urgency-low)" : "transparent";
    });
  });

  recurringLabel.addEventListener("click", () => {
    setTimeout(() => {
      recurringLabel.classList.toggle("selected", recurringCheck.checked);
      recurDateWrap.classList.toggle("visible", recurringCheck.checked);
    }, 0);
  });

  recurTypeGroup.querySelectorAll(".tt-recur-type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedRecurType = btn.dataset.type;
      recurTypeGroup.querySelectorAll(".tt-recur-type-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      recurWeekdayGroup.style.display = selectedRecurType === "weekly" ? "flex" : "none";
      recurMonthdayWrap.style.display = selectedRecurType === "monthly" ? "flex" : "none";
    });
  });

  recurWeekdayGroup.querySelectorAll(".tt-weekday-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedRecurDay = parseInt(btn.dataset.day, 10);
      recurWeekdayGroup.querySelectorAll(".tt-weekday-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
    });
  });
  recurWeekdayGroup.querySelector('[data-day="0"]').classList.add("selected");

  function resetForm() {
    editingId = null;
    titleInput.value = "";
    selectedUrgency = "medium";
    recurringCheck.checked = false;
    recurringLabel.classList.remove("selected");
    recurDateWrap.classList.remove("visible");
    selectedRecurType = "weekly";
    selectedRecurDay = 0;
    recurTypeGroup.querySelectorAll(".tt-recur-type-btn").forEach(b => b.classList.remove("selected"));
    recurTypeGroup.querySelector('[data-type="weekly"]').classList.add("selected");
    recurWeekdayGroup.style.display = "flex";
    recurMonthdayWrap.style.display = "none";
    recurWeekdayGroup.querySelectorAll(".tt-weekday-btn").forEach(b => b.classList.remove("selected"));
    recurWeekdayGroup.querySelector('[data-day="0"]').classList.add("selected");
    recurMonthdayInput.value = "";
    recurTimeInput.value = "";
    descInput.value = "";
    draftFiles = [];
    renderFormFiles();
    urgencyGroup.querySelectorAll(".tt-pill").forEach(b => {
      b.classList.remove("selected");
      b.style.background = "";
      b.style.color = "";
      b.style.borderColor = "";
    });
    const medBtn = urgencyGroup.querySelector('[data-urgency="medium"]');
    medBtn.classList.add("selected");
    medBtn.style.background = URGENCY.medium.pillBg;
    medBtn.style.color = URGENCY.medium.pillText;
    medBtn.style.borderColor = "transparent";
    formTitle.innerHTML = '<i data-lucide="sparkles" size="16"></i>משימה חדשה';
    submitBtnText.textContent = "הוסיפי משימה";
    cancelBtn.style.display = "none";
    formError.style.display = "none";
    icons();
  }

  cancelBtn.addEventListener("click", resetForm);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    if (!title) {
      formError.style.display = "flex";
      return;
    }
    formError.style.display = "none";
    submitBtn.disabled = true;
    try {
      const recurring = recurringCheck.checked;
      const recurrenceType = recurring ? selectedRecurType : null;
      const recurrenceDay = recurring
        ? (selectedRecurType === "weekly" ? selectedRecurDay : (parseInt(recurMonthdayInput.value, 10) || null))
        : null;
      const recurrenceTime = recurring ? (recurTimeInput.value || null) : null;
      if (recurring && selectedRecurType === "monthly" && !recurrenceDay) {
        formError.querySelector("span").textContent = "צריך לבחור יום בחודש לחזרה.";
        formError.style.display = "flex";
        submitBtn.disabled = false;
        return;
      }
      const description = descInput.value.trim() || null;
      const filesObj = {};
      draftFiles.forEach((f) => {
        const key = push(ref(db, "tasks/_keygen/files")).key;
        filesObj[key] = { name: f.name, dataUrl: f.dataUrl, size: f.size, uploadedAt: f.uploadedAt };
      });
      const filesPayload = Object.keys(filesObj).length ? filesObj : null;
      if (editingId) {
        await update(ref(db, "tasks/" + editingId), {
          title, urgency: selectedUrgency, recurring, recurrenceType, recurrenceDay, recurrenceTime, description, files: filesPayload
        });
      } else {
        await push(tasksRef, {
          title,
          urgency: selectedUrgency,
          recurring,
          recurrenceType,
          recurrenceDay,
          recurrenceTime,
          description,
          files: filesPayload,
          status: "todo",
          statusChangedAt: Date.now(),
          createdAt: Date.now(),
        });
      }
      resetForm();
    } catch (err) {
      formError.querySelector("span").textContent = "השמירה נכשלה, נסי שוב.";
      formError.style.display = "flex";
    } finally {
      submitBtn.disabled = false;
    }
  });

  function startEdit(id, task) {
    editingId = id;
    titleInput.value = task.title;
    selectedUrgency = task.urgency;
    recurringCheck.checked = !!task.recurring;
    recurringLabel.classList.toggle("selected", !!task.recurring);
    recurDateWrap.classList.toggle("visible", !!task.recurring);
    selectedRecurType = task.recurrenceType || "weekly";
    selectedRecurDay = selectedRecurType === "weekly" ? (task.recurrenceDay ?? 0) : 0;
    recurTypeGroup.querySelectorAll(".tt-recur-type-btn").forEach(b => {
      b.classList.toggle("selected", b.dataset.type === selectedRecurType);
    });
    recurWeekdayGroup.style.display = selectedRecurType === "weekly" ? "flex" : "none";
    recurMonthdayWrap.style.display = selectedRecurType === "monthly" ? "flex" : "none";
    recurWeekdayGroup.querySelectorAll(".tt-weekday-btn").forEach(b => {
      b.classList.toggle("selected", parseInt(b.dataset.day, 10) === selectedRecurDay);
    });
    recurMonthdayInput.value = task.recurrenceType === "monthly" ? (task.recurrenceDay || "") : "";
    recurTimeInput.value = task.recurrenceTime || "";
    descInput.value = task.description || "";
    draftFiles = task.files
      ? Object.values(task.files).map(f => ({ name: f.name, dataUrl: f.dataUrl, size: f.size, uploadedAt: f.uploadedAt }))
      : [];
    renderFormFiles();
    urgencyGroup.querySelectorAll(".tt-pill").forEach(b => {
      b.classList.remove("selected");
      b.style.background = "";
      b.style.color = "";
      b.style.borderColor = "";
      if (b.dataset.urgency === task.urgency) {
        b.classList.add("selected");
        b.style.background = URGENCY[task.urgency].pillBg;
        b.style.color = URGENCY[task.urgency].pillText;
        b.style.borderColor = task.urgency === "low" ? "var(--urgency-low)" : "transparent";
      }
    });
    formTitle.innerHTML = '<i data-lucide="pencil-line" size="16"></i>עריכת משימה';
    submitBtnText.textContent = "עדכני משימה";
    cancelBtn.style.display = "flex";
    titleInput.focus();
    icons();
  }

  function deleteTask(id) {
    remove(ref(db, "tasks/" + id));
    if (editingId === id) resetForm();
  }

  function setStatus(id, status) {
    if (status === "done") {
      justCompletedId = id;
      setTimeout(() => { justCompletedId = null; }, 500);
    }
    update(ref(db, "tasks/" + id), { status, statusChangedAt: Date.now() });
  }

  const MAX_FILE_BYTES = 4 * 1024 * 1024; // 4MB per file
  let draftFiles = []; // {name, dataUrl, size, uploadedAt}

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("read failed"));
      reader.readAsDataURL(file);
    });
  }

  function renderFormFiles() {
    formFilesList.innerHTML = "";
    draftFiles.forEach((f, index) => {
      const row = document.createElement("div");
      row.className = "tt-file-row";
      const fileIcon = document.createElement("i");
      fileIcon.setAttribute("data-lucide", "file-text");
      fileIcon.setAttribute("size", "15");
      const nameSpan = document.createElement("span");
      nameSpan.className = "tt-file-name";
      nameSpan.textContent = f.name;
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "tt-icon-btn danger";
      delBtn.innerHTML = '<i data-lucide="x" size="14"></i>';
      delBtn.addEventListener("click", () => {
        draftFiles.splice(index, 1);
        renderFormFiles();
      });
      row.appendChild(fileIcon);
      row.appendChild(nameSpan);
      row.appendChild(delBtn);
      formFilesList.appendChild(row);
    });
    icons();
  }

  async function handleFormFileSelect(fileList) {
    for (const file of Array.from(fileList)) {
      if (file.size > MAX_FILE_BYTES) {
        alert(`הקובץ "${file.name}" גדול מדי (מעל 4MB). אפשר לכווץ/לצלם ברזולוציה נמוכה יותר ולנסות שוב.`);
        continue;
      }
      try {
        const dataUrl = await readFileAsDataUrl(file);
        draftFiles.push({ name: file.name, dataUrl, size: file.size, uploadedAt: Date.now() });
      } catch (err) {
        alert(`קריאת הקובץ "${file.name}" נכשלה, נסי שוב.`);
      }
    }
    renderFormFiles();
  }

  formFileInput.addEventListener("change", (e) => {
    handleFormFileSelect(e.target.files);
    e.target.value = "";
  });

  function deleteFile(taskId, fileId) {
    remove(ref(db, `tasks/${taskId}/files/${fileId}`));
  }

  btnManager.addEventListener("click", () => {
    role = "manager";
    btnManager.classList.add("active");
    btnEmployee.classList.remove("active");
    render();
  });
  btnEmployee.addEventListener("click", () => {
    role = "employee";
    btnEmployee.classList.add("active");
    btnManager.classList.remove("active");
    render();
  });

  function render() {
    form.style.display = role === "manager" ? "block" : "none";
    const entries = Object.entries(tasksObj);
    const order = { high: 0, medium: 1, low: 2 };
    entries.sort((a, b) => {
      const ta = a[1], tb = b[1];
      const aDone = ta.status === "done" ? 1 : 0;
      const bDone = tb.status === "done" ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;
      if (order[ta.urgency] !== order[tb.urgency]) return order[ta.urgency] - order[tb.urgency];
      return (tb.createdAt || 0) - (ta.createdAt || 0);
    });

    sectionLabel.textContent = role === "manager"
      ? `כל המשימות (${entries.length})`
      : `המשימות שלך (${entries.length})`;

    taskList.innerHTML = "";

    if (entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "tt-empty";
      empty.innerHTML = `<i data-lucide="inbox" size="26"></i><div>${role === "manager" ? "אין עדיין משימות. הוסיפי משימה ראשונה למעלה." : "יעל עוד לא הוסיפה משימות."}</div>`;
      taskList.appendChild(empty);
      icons();
      return;
    }

    entries.forEach(([id, task]) => {
      const card = document.createElement("div");
      card.className = "tt-card" + (task.status === "done" ? " done" : "");
      if (justCompletedId === id) card.classList.add("pulse");
      card.style.setProperty("--urgency-color", URGENCY[task.urgency].color);

      const top = document.createElement("div");
      top.className = "tt-card-top";
      const titleEl = document.createElement("p");
      titleEl.className = "tt-card-title";
      if (task.status === "done") {
        titleEl.innerHTML = '<span class="tt-done-badge"><i data-lucide="check" size="13"></i></span>';
      }
      titleEl.appendChild(document.createTextNode(task.title));
      top.appendChild(titleEl);

      if (role === "manager") {
        const actions = document.createElement("div");
        actions.className = "tt-card-actions";
        const editBtn = document.createElement("button");
        editBtn.className = "tt-icon-btn";
        editBtn.innerHTML = '<i data-lucide="pencil" size="15"></i>';
        editBtn.addEventListener("click", () => startEdit(id, task));
        const delBtn = document.createElement("button");
        delBtn.className = "tt-icon-btn danger";
        delBtn.innerHTML = '<i data-lucide="trash-2" size="15"></i>';
        delBtn.addEventListener("click", () => deleteTask(id));
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        top.appendChild(actions);
      }
      card.appendChild(top);

      const meta = document.createElement("div");
      meta.className = "tt-meta";
      const urg = URGENCY[task.urgency];
      const urgChip = document.createElement("span");
      urgChip.className = "tt-chip";
      urgChip.style.background = urg.soft;
      urgChip.style.color = urg.color;
      urgChip.innerHTML = `<i data-lucide="${urg.icon}" size="12"></i>דחיפות ${urg.label}`;
      meta.appendChild(urgChip);

      if (task.recurring) {
        const recChip = document.createElement("span");
        recChip.className = "tt-recur-chip";
        const recLabel = formatRecurrence(task);
        recChip.innerHTML = `<i data-lucide="repeat" size="12"></i>חוזרת${recLabel ? " · " + recLabel : ""}`;
        meta.appendChild(recChip);
      }

      if (role === "manager") {
        const st = STATUS[task.status];
        const statusChip = document.createElement("span");
        statusChip.className = "tt-status-readonly";
        if (task.status === "done") {
          statusChip.style.background = st.color;
          statusChip.style.color = "white";
        } else {
          statusChip.style.background = st.soft;
          statusChip.style.color = st.color;
        }
        statusChip.innerHTML = `<i data-lucide="${st.icon}" size="12"></i>${st.label}`;
        meta.appendChild(statusChip);
      }
      card.appendChild(meta);

      if (role === "employee") {
        const statusGroup = document.createElement("div");
        statusGroup.className = "tt-status-group";
        Object.entries(STATUS).forEach(([key, v]) => {
          const btn = document.createElement("button");
          btn.className = "tt-status-pill" + (task.status === key ? " selected" : "");
          if (task.status === key) {
            if (key === "done") {
              btn.style.background = v.color;
              btn.style.color = "white";
            } else {
              btn.style.background = v.soft;
              btn.style.color = v.color;
            }
          }
          btn.innerHTML = `<i data-lucide="${v.icon}" size="13"></i>${v.label}`;
          btn.addEventListener("click", () => setStatus(id, key));
          statusGroup.appendChild(btn);
        });
        card.appendChild(statusGroup);

        const noteWrap = document.createElement("div");
        noteWrap.className = "tt-note-edit-wrap";
        const noteLabel = document.createElement("p");
        noteLabel.className = "tt-note-edit-label";
        noteLabel.innerHTML = '<i data-lucide="message-square" size="13"></i>הערה ליעל';
        const noteTextarea = document.createElement("textarea");
        noteTextarea.className = "tt-note-textarea";
        noteTextarea.rows = 2;
        noteTextarea.placeholder = "כתבי כאן הערה שיעל תראה...";
        noteTextarea.value = task.employeeNote || "";
        const savedLabel = document.createElement("p");
        savedLabel.className = "tt-note-saved";
        savedLabel.innerHTML = '<i data-lucide="check" size="11"></i> נשמר';
        noteTextarea.addEventListener("blur", async () => {
          const val = noteTextarea.value.trim();
          if (val === (task.employeeNote || "")) return;
          await update(ref(db, "tasks/" + id), { employeeNote: val || null });
          savedLabel.classList.add("visible");
          setTimeout(() => savedLabel.classList.remove("visible"), 1500);
        });
        noteWrap.appendChild(noteLabel);
        noteWrap.appendChild(noteTextarea);
        noteWrap.appendChild(savedLabel);
        card.appendChild(noteWrap);
      }

      if (role === "manager" && task.employeeNote) {
        const noteBox = document.createElement("div");
        noteBox.className = "tt-note-box";
        const noteBoxLabel = document.createElement("p");
        noteBoxLabel.className = "tt-note-box-label";
        noteBoxLabel.innerHTML = '<i data-lucide="message-square" size="13"></i>הערה משיר';
        const noteBoxText = document.createElement("p");
        noteBoxText.className = "tt-note-box-text";
        noteBoxText.textContent = task.employeeNote;
        noteBox.appendChild(noteBoxLabel);
        noteBox.appendChild(noteBoxText);
        card.appendChild(noteBox);
      }

      if (task.description) {
        const descEl = document.createElement("p");
        descEl.className = "tt-card-desc";
        descEl.textContent = task.description;
        card.appendChild(descEl);
      }

      const filesSection = document.createElement("div");
      filesSection.className = "tt-files";

      const fileEntries = task.files ? Object.entries(task.files) : [];

      if (fileEntries.length > 0) {
        const filesHeader = document.createElement("div");
        filesHeader.className = "tt-files-header";
        filesHeader.innerHTML = `<i data-lucide="paperclip" size="13"></i><span>קבצים מצורפים (${fileEntries.length})</span>`;
        filesSection.appendChild(filesHeader);

        fileEntries.forEach(([fileId, f]) => {
          const row = document.createElement("div");
          row.className = "tt-file-row";
          const fileIcon = document.createElement("i");
          fileIcon.setAttribute("data-lucide", "file-text");
          fileIcon.setAttribute("size", "15");
          const nameSpan = document.createElement("span");
          nameSpan.className = "tt-file-name";
          nameSpan.textContent = f.name;
          const dlLink = document.createElement("a");
          dlLink.href = f.dataUrl;
          dlLink.download = f.name;
          dlLink.className = "tt-icon-btn";
          dlLink.innerHTML = '<i data-lucide="download" size="14"></i>';
          row.appendChild(fileIcon);
          row.appendChild(nameSpan);
          row.appendChild(dlLink);
          if (role === "manager") {
            const delBtn = document.createElement("button");
            delBtn.className = "tt-icon-btn danger";
            delBtn.innerHTML = '<i data-lucide="x" size="14"></i>';
            delBtn.addEventListener("click", () => deleteFile(id, fileId));
            row.appendChild(delBtn);
          }
          filesSection.appendChild(row);
        });
      }

      if (filesSection.childNodes.length > 0) {
        card.appendChild(filesSection);
      }

      taskList.appendChild(card);
    });
    icons();
  }
</script>
</body>
</html>
